<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Tracker</title>

    <!-- tailwind and daisyui  -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- fontawesome cnd link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- google font geist  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="bg-[#F8FAFC]">
    <!-- navbar desing here -->
    <nav class=" w-11/12 mx-auto flex-wrap md:flex justify-between bg-white py-5 shadow-sm">
        <div class="flex items-center mb-5 sm:mb-4 ">
            <i class="fa-brands fa-github text-[35px] mr-2"></i>
            <h4 class="text-xl font-bold">GitHub Issues Tracker</h4>
        </div>
        <div class="flex ">
            <label class="input">
                <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                        stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </g>
                </svg>
                <input id="search-input" type="search" required placeholder="Search" />
            </label>
            <button id="search-btn" class="btn btn-primary"> search</button>
        </div>
    </nav>

    <!-- buttons here  -->
    <section class="max-w-[1110px] mx-auto bg-white mt-14 mb-4">
        <div class="p-6 space-x-2 shadow-sm">
            <button id="btn-all" class="bnt-issues btn btn-soft btn-primary active">All</button>
            <button id="btn-open" class="bnt-issues btn btn-soft btn-primary">open</button>
            <button id="btn-closed" class="bnt-issues btn btn-soft btn-primary">closed</button>
        </div>
    </section>


    <!-- issues count here  -->
    <section class="max-w-[1110px] mx-auto bg-white mb-4 pl-3 md:flex lg:flex justify-between items-center">

        <div class="flex items-center p-3  md:p-9 space-x-2">
            <div>
                <img src="assets/Aperture.png" alt="" class="w-7">
            </div>
            <div>
                <h4 class="text-xl font-bold"><span id="all-issues-count">50</span> Issues</h4>
                <p class="text-gray-400">Track and manage your project issues</p>
            </div>
        </div>

        <div class="flex gap-4 pr-4">
            <p><span><i class="fa-solid fa-circle text-[12px] text-[#00A96E]"></i></span> Open</p>
            <p><span><i class="fa-solid fa-circle text-[12px] text-[#A855F7]"></i></span> close</p>

        </div>

    </section>

    <!-- all carts issues  are here  -->
    <section class="max-w-[1110px] mx-auto">
        <div id="issues-cart-container"
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 px-3">

        </div>

    </section>

    <!-- modalllllllllllllll -->
    <section>

        <!-- Open the modal using ID.showModal() method -->
        <!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
        <!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
        <dialog id="issue_modal" class="modal modal-bottom sm:modal-middle">
            <div class="modal-box">

                <div id="issue-details-container"></div>

                <div class="modal-action">
                    <form method="dialog">
                        <!-- if there is a button in form, it will close the modal -->
                        <button class="btn">Close</button>
                    </form>
                </div>
            </div>
        </dialog>
    </section>
    <script src="script/login.js"></script>
    <script src="script/main.js"></script>
</body>

</html>
